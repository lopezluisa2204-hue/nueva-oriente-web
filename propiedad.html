<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedad — Nueva Oriente</title>
<link rel="stylesheet" href="css/styles.css">
<!-- Detecta enlaces de invitación/confirmación de Netlify Identity que
     lleguen a esta página (por correo) y abre el formulario de contraseña. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
if (window.netlifyIdentity) {
  window.netlifyIdentity.on("init", (user) => {
    if (!user) {
      window.netlifyIdentity.on("login", () => {
        document.location.href = "/admin/";
      });
    }
  });
}
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">
      <span class="logo-mark"><img src="img/logo-nueva-oriente-transparente.png" alt="Logo Nueva Oriente"></span>
      <span class="logo-text">Nueva Oriente<span>INMOBILIARIA</span></span>
    </a>
    <nav class="nav-links">
      <div class="nav-item">
        <a href="index.html#propiedades" class="dropdown-toggle">Propiedades</a>
        <div class="dropdown-menu">
          <a href="index.html?categoria=Casa#propiedades">Casas</a>
          <a href="index.html?categoria=Apartamento#propiedades">Apartamentos</a>
          <a href="index.html?categoria=Lote#propiedades">Lotes</a>
          <a href="index.html?categoria=Finca#propiedades">Fincas</a>
          <a href="index.html?categoria=Bodega#propiedades">Bodegas</a>
        </div>
      </div>
      <a href="index.html#servicios">Servicios</a>
      <a href="index.html#nosotros">Sobre nosotros</a>
      <a href="index.html#contacto">Contacto</a>
      <a class="nav-cta" data-wa data-wa-msg="Hola, quiero más información sobre sus propiedades." href="#">¡Contáctanos!</a>
    </nav>
    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
  </div>
</header>

<!-- Todo el contenido de esta ficha se pinta desde data/properties.json,
     buscando la propiedad cuyo "slug" coincide con ?id= en la URL.
     Ver renderDetail() en js/main.js. -->
<div class="wrap" id="propertyDetail">
  <p style="color:var(--text-soft);padding:40px 0;">Cargando propiedad…</p>
</div>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Nueva Oriente</span>
      <a href="admin/" style="color:var(--text-soft);font-size:.8rem;">Acceso administrador</a>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
